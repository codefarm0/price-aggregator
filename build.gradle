plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
}

group = 'in.codefarm'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', "2025.1.1")
	set('wiremockVersion', "3.13.1")
	set('testcontainersVersion', "2.0.5")
	set('testcontainersJunitVersion', "1.21.4")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'

	// Test dependencies
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation "org.wiremock:wiremock-standalone:${wiremockVersion}"
	testImplementation "org.testcontainers:testcontainers:${testcontainersVersion}"
	testImplementation "org.testcontainers:junit-jupiter:${testcontainersJunitVersion}"
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
		mavenBom "org.testcontainers:testcontainers-bom:${testcontainersVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

// JaCoCo configuration
jacoco {
	toolVersion = "0.8.13"
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
		csv.required = false
	}
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: [
				'in/codefarm/price/aggregator/PriceAggregatorApplication.class',
				'in/codefarm/price/aggregator/config/*',
				'in/codefarm/price/aggregator/dto/*',
				'in/codefarm/price/aggregator/mock/**'
			])
		}))
	}
}

jacocoTestCoverageVerification {
	dependsOn test
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: [
				'in/codefarm/price/aggregator/PriceAggregatorApplication.class',
				'in/codefarm/price/aggregator/config/*',
				'in/codefarm/price/aggregator/dto/*',
				'in/codefarm/price/aggregator/mock/**'
			])
		}))
	}
	violationRules {
		rule {
			limit {
				minimum = 0.75
			}
		}
		rule {
			element = 'CLASS'
			includes = [
				'in.codefarm.price.aggregator.controller.PriceController',
				'in.codefarm.price.aggregator.service.PriceService',
			]
			limit {
				minimum = 0.80
			}
		}
		rule {
			element = 'CLASS'
			includes = [
				'in.codefarm.price.aggregator.service.PriceCacheService',
			]
			limit {
				minimum = 0.70
			}
		}
	}
}

// Performance Testing with k6
def k6Script = project.findProperty('script') ?: 'baseline'
def k6Args = project.findProperty('args') ?: ''
def k6ScriptFile = file("performance-tests/${k6Script}.js")

tasks.register('k6') {
	group = 'verification'
	description = 'Run k6 performance tests'

	doLast {
		def baseUrl = System.getenv('K6_BASE_URL') ?: 'http://localhost:8080'

		if (!k6ScriptFile.exists()) {
			throw new GradleException("Performance test script not found: ${k6ScriptFile}")
		}

		def hasK6 = commandExists('k6')

		def pb = hasK6
			? new ProcessBuilder("k6", "run", k6ScriptFile.absolutePath)
			: new ProcessBuilder(
				"docker", "run", "--rm", "-v", "${projectDir}/performance-tests:/scripts",
				"-i", "grafana/k6:latest", "run", "/scripts/${k6Script}.js"
			)

		if (k6Args) {
			def argsList = new ArrayList<>(pb.command())
			k6Args.split(' ').each { argsList.add(it) }
			pb.command(argsList)
		}

		def env = pb.environment()
		env.put("K6_BASE_URL", baseUrl)
		pb.inheritIO()

		def process = pb.start()
		def exitCode = process.waitFor()

		// Exit code 99 = threshold failures (informational, not a build failure)
		// Any other non-zero exit code = real error
		if (exitCode != 0 && exitCode != 99) {
			throw new GradleException("k6 test failed with exit code ${exitCode}")
		}
		if (exitCode == 99) {
			println "\n⚠️  Some thresholds were not met. See results above for details."
		}
	}
}

def commandExists(String cmd) {
	try {
		def pb = new ProcessBuilder("which", cmd)
		pb.redirectErrorStream(true)
		def process = pb.start()
		def exitCode = process.waitFor()
		return exitCode == 0
	} catch (Exception e) {
		return false
	}
}
