spring:
  config:
    import: optional:file:./config/application.yaml
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  application:
    name: price-aggregator

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        slowCallDurationThreshold: 1000ms
        slowCallRateThreshold: 50
        recordExceptions:
          - java.lang.RuntimeException
          - org.springframework.web.reactive.function.client.WebClientResponseException
          - java.util.concurrent.TimeoutException
          - java.net.ConnectException
    instances:
      amazon:
        baseConfig: default
      flipkart:
        baseConfig: default
      walmart:
        baseConfig: default

---

spring:
  config:
    activate:
      on-profile: default

vendors:
  amazon:
    base-url: http://localhost:8080
  flipkart:
    base-url: http://localhost:8080
  walmart:
    base-url: http://localhost:8080

price:
  fetch:
    timeout-ms: 2000
  pool:
    core-size: 3
    max-size: 10
    queue-capacity: 100
    thread-name-prefix: price-fetch-
  cache:
    ttl-minutes: 10

---

spring:
  config:
    activate:
      on-profile: prod

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5
          max-wait: 3000ms

vendors:
  amazon:
    base-url: http://host.docker.internal:8080
  flipkart:
    base-url: http://host.docker.internal:8080
  walmart:
    base-url: http://host.docker.internal:8080

price:
  fetch:
    timeout-ms: 2000
  pool:
    core-size: 3
    max-size: 10
    queue-capacity: 100
    thread-name-prefix: price-fetch-
  cache:
    ttl-minutes: 10